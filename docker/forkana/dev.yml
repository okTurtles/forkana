name: forkana

services:
  registry:
    # Pinned by manifest digest so the tag can never be swapped.
    image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    container_name: registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    environment:
      # Registry 3.0.0 enables OpenTelemetry tracing by default and tries to
      # export to localhost:4318.  Disable it since we don't run a collector.
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - forkana-network

  postgres:
    image: postgres:14-alpine
    container_name: forkana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forkana
      POSTGRES_USER: forkana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${HOME}/forkana/postgres:/var/lib/postgresql/data
    networks:
      - forkana-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkana -d forkana"]
      interval: 10s
      timeout: 5s
      retries: 5

  forkana:
    # Human-friendly default; deploy.sh generates compose.override.yml to pin
    # the exact digest built from each commit.
    image: localhost:5000/forkana:latest
    container_name: forkana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "127.0.0.1:${FORKANA_HOST_PORT:-3000}:3000"
    environment:
      # Plain vars consumed only by envsubst on first-boot template generation.
      APP_NAME: "Forkana"
      RUN_MODE: prod

      # GITEA__-prefixed vars are applied by environment-to-ini on every
      # container startup, ensuring changes always take effect.

      # Server
      GITEA__server__DOMAIN: ${FORKANA_DOMAIN}
      GITEA__server__ROOT_URL: https://${FORKANA_DOMAIN}/
      GITEA__server__DISABLE_SSH: "true"

      # Database
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: forkana
      GITEA__database__USER: forkana
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__database__SSL_MODE: disable

      # Session
      # Required, not just a default: docker-setup.sh only writes app.ini when
      # it is absent, and /etc/gitea is a persistent volume, so deployments
      # created before the db switch keep PROVIDER = file without this override.
      GITEA__session__PROVIDER: db
      GITEA__session__SESSION_LIFE_TIME: "604800"

      # Service
      GITEA__service__DISABLE_REGISTRATION: "true"

      # Security
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${FORKANA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${FORKANA_INTERNAL_TOKEN}
      # Trusted reverse-proxy CIDRs.  Keep this list in sync with the subnet
      # pinned below under networks.forkana-network.ipam.config.subnet.
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: "127.0.0.0/8,::1/128,172.30.0.0/16"
      GITEA__oauth2__JWT_SECRET: ${FORKANA_JWT_SECRET}

      # Article attachments
      GITEA__attachment__ENABLED: "true"
      # Serves pre-association attachments through their origin repository.
      # `gitea admin backfill-article-attachments --finalize` switches it off in
      # the database, which then takes precedence over this value.
      GITEA__attachment__LEGACY_ARTICLE_FALLBACK: "true"
      # Section names containing "." are written as _0X2E_ (environment-to-ini).
      # The collector skips its runs until the backfill has been finalized; it only
      # reclaims attachments older than OLDER_THAN that nothing references.
      GITEA__cron_0X2E_gc_article_attachments__ENABLED: "true"
      GITEA__cron_0X2E_gc_article_attachments__RUN_AT_START: "false"
      GITEA__cron_0X2E_gc_article_attachments__SCHEDULE: "@every 24h"
      GITEA__cron_0X2E_gc_article_attachments__OLDER_THAN: "168h"
      GITEA__cron_0X2E_gc_article_attachments__MAX_PER_RUN: "1000"
      # Add-only repair of missing associations; never removes one.
      GITEA__cron_0X2E_reconcile_article_attachments__ENABLED: "true"
      GITEA__cron_0X2E_reconcile_article_attachments__RUN_AT_START: "false"
      GITEA__cron_0X2E_reconcile_article_attachments__SCHEDULE: "@every 24h"
      GITEA__cron_0X2E_reconcile_article_attachments__BATCH_SIZE: "50"
    volumes:
      - ${HOME}/forkana/data:/var/lib/gitea
      - ${HOME}/forkana/config:/etc/gitea
    networks:
      - forkana-network

volumes:
  registry-data:

networks:
  forkana-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
