name: e2e-tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Node must use the system CA bundle that fix-ubuntu-ca-roots fixes. See
  # https://github.com/okTurtles/libcheloniajs/blob/main/.github/actions/fix-ubuntu-ca-roots/action.yml
  NODE_OPTIONS: --use-openssl-ca

jobs:
  files-changed:
    uses: ./.github/workflows/files-changed.yml

  test-e2e:
    if: needs.files-changed.outputs.backend == 'true' || needs.files-changed.outputs.frontend == 'true' || needs.files-changed.outputs.actions == 'true' || needs.files-changed.outputs.e2e == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main
        id: ca-roots
        with:
          sync-nss-db: true
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: pnpm/action-setup@v4
        with:
          version: "^10.26.0"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - run: make deps-frontend frontend deps-backend
      - run: pnpm exec playwright install --with-deps
      - run: make test-e2e-sqlite
        timeout-minutes: 40
        env:
          USE_REPO_TEST_DIR: 1
      # Skipped when fix-ubuntu-ca-roots fails: the CA bundle can then still
      # trust a removed root, and this step sends the runtime token through it.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.ca-roots.outcome == 'success' }}
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            tests/e2e/test-artifacts/
            tests/e2e/reports/
          retention-days: 30
          if-no-files-found: ignore
