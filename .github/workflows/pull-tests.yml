name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Node must use the system CA bundle that fix-ubuntu-ca-roots fixes. See
  # https://github.com/okTurtles/libcheloniajs/blob/main/.github/actions/fix-ubuntu-ca-roots/action.yml
  NODE_OPTIONS: --use-openssl-ca

jobs:
  files-changed:
    uses: ./.github/workflows/files-changed.yml

  test-frontend:
    if: needs.files-changed.outputs.frontend == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "^10.26.0"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: make deps-frontend

      - name: Run frontend tests
        run: make test-frontend

  test-backend:
    if: needs.files-changed.outputs.backend == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main
        id: ca-roots

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install backend dependencies
        run: make deps-backend

      - name: Build backend
        run: make backend
        env:
          TAGS: bindata

      - name: Run backend tests with coverage
        run: make unit-test-coverage test-check
        env:
          TAGS: bindata
          CI: "" # Unset CI to skip tests requiring external services (Redis, Elasticsearch, Meilisearch, Azure Storage)

      # Skipped when fix-ubuntu-ca-roots fails: the CA bundle can then still
      # trust a removed root, and this step downloads the Codecov CLI and the
      # key that verifies it through that bundle, then runs the CLI.
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always() && steps.ca-roots.outcome == 'success'
        with:
          files: ./coverage.out
          flags: unittests
          name: backend-unit-tests
