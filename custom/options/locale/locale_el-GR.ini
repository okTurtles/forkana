settings.protect_required_approvals_desc=Να επιτρέπεται η συγχώνευση αιτήματος αλλαγής μόνο με αρκετές απαιτούμενες εγκρίσεις. Οι απαιτούμενες εγκρίσεις προέρχονται είτε από χρήστες ή ομάδες της λίστας επιτρεπόμενων είτε από οποιονδήποτε έχει δικαίωμα εγγραφής.
