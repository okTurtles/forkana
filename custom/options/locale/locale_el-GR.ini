settings.public_access.docs.everyone_read=Ανάγνωση για όλους: όλοι οι συνδεδεμένοι χρήστες έχουν πρόσβαση στη μονάδα με δικαίωμα ανάγνωσης. Το δικαίωμα ανάγνωσης στις μονάδες ζητημάτων/αιτημάτων αλλαγής σημαίνει επίσης ότι οι χρήστες μπορούν να δημιουργούν νέα ζητήματα/αιτήματα αλλαγής.
