# en: This change request cannot be merged because it is marked as being a work in progress.
pulls.no_merge_wip = Ní féidir an t-iarratas athraithe seo a chumasc mar go bhfuil sé marcáilte mar obair idir lámha.
# en: This change request is not ready to be merged. Check review status and status checks.
pulls.no_merge_not_ready = Níl an t-iarratas athraithe seo réidh le cumasc. Seiceáil stádas an athbhreithnithe agus na seiceálacha stádais.
# en: You are not authorized to merge this change request.
pulls.no_merge_access = Níl údarás agat an t-iarratas athraithe seo a chumasc.
# en: Only the article owner and its maintainers can accept change requests.
pulls.only_owner_can_merge = Ní féidir ach le húinéir an ailt agus a chothabhálaithe glacadh le hiarratais athraithe.
# en: Merge change request
pulls.squash_merge_pull_request = Cumaisc an t-iarratas athraithe
# en: You cannot use this merge option for this change request.
pulls.invalid_merge_option = Ní féidir leat an rogha cumaisc seo a úsáid don iarratas athraithe seo.
# en: Failed: The change request has been merged. You cannot merge again or change the target branch.
pulls.has_merged = Theip: Cumascadh an t-iarratas athraithe. Ní féidir leat é a chumasc arís ná an spriocbhrainse a athrú.
# en: Failed: The change request has been merged and can no longer be closed.
pulls.close_blocked_merged = Theip: Cumascadh an t-iarratas athraithe agus ní féidir é a dhúnadh a thuilleadh.
# en: `You cannot perform a reopen operation because there is a pending change request (#%d) with identical properties.`
pulls.open_unmerged_pull_exists = `Ní féidir leat é a athoscailt mar go bhfuil iarratas athraithe ar feitheamh (#%d) leis na hairíonna céanna.`
# en: Close Change Request
pulls.close = Dún an t-Iarratas Athraithe
# en: `closed this change request <a id="%[1]s" href="#%[1]s">%[2]s</a>`
pulls.closed_at = `dhún an t-iarratas athraithe seo <a id="%[1]s" href="#%[1]s">%[2]s</a>`
# en: `reopened this change request <a id="%[1]s" href="#%[1]s">%[2]s</a>`
pulls.reopened_at = `d'athoscail an t-iarratas athraithe seo <a id="%[1]s" href="#%[1]s">%[2]s</a>`
# en: Warning: This operation cannot merge change request because "autodetect manual merge" is not enabled.
pulls.cmd_instruction_merge_warning = Rabhadh: Ní féidir leis an oibríocht seo an t-iarratas athraithe a chumasc mar nach bhfuil "braith cumasc láimhe go huathoibríoch" cumasaithe.
# en: The change request was scheduled to merge when all checks succeed.
pulls.auto_merge_newly_scheduled = Sceidealaíodh an t-iarratas athraithe le cumasc nuair a éireoidh le gach seiceáil.
# en: %[1]s scheduled this change request to auto merge when all checks succeed %[2]s.
pulls.auto_merge_has_pending_schedule = Sceidealaigh %[1]s an t-iarratas athraithe seo le cumasc go huathoibríoch nuair a éireoidh le gach seiceáil %[2]s.
# en: This change request is not scheduled to auto merge.
pulls.auto_merge_not_scheduled = Níl an t-iarratas athraithe seo sceidealaithe le cumasc go huathoibríoch.
# en: The auto merge was canceled for this change request.
pulls.auto_merge_canceled_schedule = Cealaíodh an cumasc uathoibríoch don iarratas athraithe seo.
# en: `scheduled this change request to auto merge when all checks succeed %[1]s`
pulls.auto_merge_newly_scheduled_comment = `sceidealaigh an t-iarratas athraithe seo le cumasc go huathoibríoch nuair a éireoidh le gach seiceáil %[1]s`
# en: `canceled auto merging this change request when all checks succeed %[1]s`
pulls.auto_merge_canceled_schedule_comment = `chealaigh cumasc uathoibríoch an iarratais athraithe seo nuair a éireoidh le gach seiceáil %[1]s`
