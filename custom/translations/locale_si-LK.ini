[mail]
# en: @%[1]s assigned you to change request %[2]s in repository %[3]s.
issue_assigned.pull = @%[1]s ඔබව %[3]s කෝෂ්ඨයේ %[2]s වෙනස් කිරීමේ ඉල්ලීමට පැවරීය.
# en: <b>@%[1]s</b> approved this change request.
issue.action.approve = <b>@%[1]s</b> මෙම වෙනස් කිරීමේ ඉල්ලීම අනුමත කළේය.
# en: <b>@%[1]s</b> requested changes on this change request.
issue.action.reject = <b>@%[1]s</b> මෙම වෙනස් කිරීමේ ඉල්ලීමේ වෙනස්කම් ඉල්ලා සිටියේය.
# en: <b>@%[1]s</b> commented on this change request.
issue.action.review = <b>@%[1]s</b> මෙම වෙනස් කිරීමේ ඉල්ලීමට අදහස් දැක්වීය.
# en: <b>@%[1]s</b> dismissed last review from %[2]s for this change request.
issue.action.review_dismissed = <b>@%[1]s</b> මෙම වෙනස් කිරීමේ ඉල්ලීම සඳහා %[2]s ගේ අවසාන සමාලෝචනය ප්‍රතික්ෂේප කළේය.
# en: <b>@%[1]s</b> marked this change request ready for review.
issue.action.ready_for_review = <b>@%[1]s</b> මෙම වෙනස් කිරීමේ ඉල්ලීම සමාලෝචනයට සූදානම් ලෙස සලකුණු කළේය.
# en: %s invited you to maintain the article "%s"
repo.article_collaborator.invite.subject = %s ඔබට „%s“ ලිපිය නඩත්තු කිරීමට ආරාධනා කළේය
# en: You were invited as %[1]s. To accept or decline it, visit %[2]s or just ignore it.
repo.article_collaborator.invite.body = ඔබට %[1]s ලෙස ආරාධනා කර ඇත. එය පිළිගැනීමට හෝ ප්‍රතික්ෂේප කිරීමට %[2]s වෙත පිවිසෙන්න, නැතහොත් එය නොසලකා හරින්න.

