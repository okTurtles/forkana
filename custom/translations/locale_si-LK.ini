# en: A new subject title cannot contain an HTML character reference such as &amp;amp; or &amp;#47;.
form.subject_title_html_entity = නව විෂයක මාතෘකාවේ &amp;amp; හෝ &amp;#47; වැනි HTML අක්ෂර යොමුවක් අඩංගු විය නොහැක.
# en: A new subject title cannot contain three or more consecutive tildes (~~~).
