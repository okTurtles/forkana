# en: A new subject title cannot be "." or "..", start with "./" or "../", contain "/./" or "/../", or end with "/." or "/..".
form.subject_title_relative_path = නව විෂයක මාතෘකාව „.“ හෝ „..“ විය නොහැක, „./“ හෝ „../“ න් ආරම්භ විය නොහැක, „/./“ හෝ „/../“ අඩංගු විය නොහැක, හෝ „/.“ හෝ „/..“ න් අවසන් විය නොහැක.
# en: A new subject title cannot start with a colon (:).
