new_repo_helper = <strong>ඔබ නව විෂයක් නිර්මාණය කිරීමට සූදානම්.</strong><br>Forkana හි වෙනත් පරිශීලකයින්ට විෂයක් තුළ ඇති ලිපි සංස්කරණය කිරීමට සහ දෙබලක කිරීමට හැකිය. අනුපිටපත් වළක්වා ගැනීමට, අපගේ මධ්‍යස්ථ කණ්ඩායම ඔබේ ඉදිරිපත් කිරීම සමාලෝචනය කරනු ඇත. විෂය අනුමත වූ පසු ඔබට දැනුම් දෙනු ලැබේ.
