# en: A new subject title must be at most %d bytes long in UTF-8. Accented letters and most non-Latin characters take 2 or 3 bytes each, and emoji take 4.
form.subject_title_too_long = නව විෂයක මාතෘකාව UTF-8 හි උපරිම බයිට් %d ක් විය යුතුය. ස්වරලක්ෂණ සහිත අකුරු සහ බොහෝ ලතින් නොවන අක්ෂර එකකට බයිට් 2 ක් හෝ 3 ක් ද, ඉමෝජි බයිට් 4 ක් ද ගනී.
